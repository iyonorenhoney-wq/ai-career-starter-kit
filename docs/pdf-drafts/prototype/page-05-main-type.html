<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page 05 Main Type</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./components.css">
</head>
<body data-view="actual">
  <main class="viewer">
    <nav class="toolbar" aria-label="表示切り替え">
      <button type="button" data-view-button="actual" aria-pressed="true">実寸（A4）</button>
      <button type="button" data-view-button="phone" aria-pressed="false">スマホ幅縮小</button>
    </nav>
    <div class="page-shell">
      <section class="page">
        <div class="running-head">TYPE</div>
        <div class="safe">
          <p class="eyebrow">MAIN TYPE</p>
          <div class="section">
            <span class="icon-badge" aria-label="PenTool icon">
              <svg width="29" height="29" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m12 19 7-7 3 3-7 7-3-3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="m2 2 7.586 7.586" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="11" cy="11" r="2" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </span>
          </div>
          <div class="section">
            <h1 class="h1">AI CREATOR</h1>
            <p class="h2">AIクリエイター</p>
          </div>
          <div class="section">
            <p class="h3">「アイデアを、AIで形にする人。」</p>
          </div>
          <div class="short-rule"></div>
          <p class="body-text">あなたは、AIを使って「考える」だけより、実際に何かを作ることで力を発揮しやすいタイプです。</p>
          <div class="section">
            <p class="body-text">あなたは、頭の中で考え続けるより、実際にWeb・デザイン・画像・動画・資料・コンテンツなどを作ることで理解が深まりやすいタイプです。AIは、質問に答えてもらうだけの存在ではなく、一緒に制作するパートナーとして使うことで強みが出やすくなります。最初から完璧な作品を作る必要はありません。作る、見直す、修正する。この繰り返しが、あなたの成長につながります。</p>
          </div>
        </div>
        <div class="footer">05</div>
      </section>
    </div>
  </main>
  <script>
    document.querySelectorAll("[data-view-button]").forEach((button) => {
      button.addEventListener("click", () => {
        document.body.dataset.view = button.dataset.viewButton;
        document.querySelectorAll("[data-view-button]").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
      });
    });
  </script>
</body>
</html>
